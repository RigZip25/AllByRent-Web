name: Fix Czech stats live

on:
  push:
    paths:
      - '.github/workflows/fix-czech-stats-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Czech stats selector and clean up
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cs/index.html')
          s = p.read_text(encoding='utf-8')
          old1 = "leafByText('Půjčit ÷ prodat · darovat')"
          new1 = "leafByText('Půjčit · prodat · darovat')"
          old2 = "leafByText('Ovęřené profily')"
          new2 = "leafByText('Ověřené profily')"
          changed = False
          if old1 in s:
              s = s.replace(old1, new1, 1)
              changed = True
          if old2 in s:
              s = s.replace(old2, new2, 1)
              changed = True
          if not changed:
              raise SystemExit('Expected broken Czech stats selectors not found')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-czech-stats-live.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs/index.html .github/workflows/fix-czech-stats-live.yml
          git commit -m "Fix Czech stats block rendering"
          git push
