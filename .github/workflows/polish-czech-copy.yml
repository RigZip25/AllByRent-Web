name: Polish Czech copy

on:
  push:
    paths:
      - '.github/workflows/polish-czech-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply native Czech copy
        shell: bash
        env:
          REPL_B64: 
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          p = Path('cs/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = json.loads(base64.b64decode(os.environ['REPL_B64']).decode('utf-8'))
          changed = 0
          missing = []
          for old, new in replacements:
              n = s.count(old)
              if n:
                  s = s.replace(old, new)
                  changed += n
              else:
                  missing.append(old)
          if changed < 30:
              raise SystemExit(f'Refusing suspicious edit: only {changed} replacements matched; missing={len(missing)}')
          p.write_text(s, encoding='utf-8')
          print(f'Applied {changed} replacements; {len(missing)} source strings were already absent.')
          PY
      - name: Commit Czech polish and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/polish-czech-copy.yml cs/copy-audit.txt
          git add cs/index.html
          git commit -m "Polish Czech marketplace copy"
          git push origin HEAD:main
