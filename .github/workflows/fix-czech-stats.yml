name: Fix Czech stats layout

on:
  push:
    paths:
      - '.github/workflows/fix-czech-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish Czech stats block
        shell: bash
        env:
          PAYLOAD_B64:  gaj0wO2o8ZS5jaGlsZHJlbi5sZW5ndGg7aisrKWlmKG5vcm0oZS5jaGlsZHJlbltqXS50ZXh0Q29udGVudCk9PT10ZXh0KXtleGFjdENoaWxkPXRydWU7YnJlYWt9aWYoIWV4YWN0Q2hpbGQpcmV0dXJuIGV9fXJldHVybiBudWxsfQpmdW5jdGlvbiBkaXJlY3RDaGlsZFV uZGVyKGEsbil7d2hpbGUobiYmbi5wYXJlbnRFbGVtZW50IT09YSluPW4ucGFyZW50RWxlbWVudDtyZXR1cm4gbiYmbi5wYXJlbnRFbGVtZW50PT09YT9uOm51bGx9CmZ1bmN0aW9uIGZpbmRHcmlkKGEsYixjKXt2YXIgbj1hLnBhcmVudEVsZW1lbnQ7d2hpbGUobiYmbiE9PWRvY3VtZW50LmJvZHkpe2lmKG4uY29udGFpbnMoYikmJm4uY29udGFpbnMoYykpe3ZhciBjYT1kaXJlY3RDaGlsZFV 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('cs/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'EVORIOS_CZ_STATS_POLISH_V1'
          if marker not in s:
              payload = base64.b64decode(os.environ['PAYLOAD_B64']).decode('utf-8')
              if '</body>' not in s:
                  raise SystemExit('Could not find </body>; refusing unsafe edit')
              s = s.replace('</body>', payload + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('Inserted Czech stats polish.')
          else:
              print('Already present.')
          PY
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-czech-stats.yml
          git add cs/index.html
          git commit -m "Polish Czech stats block layout"
          git push origin HEAD:main
