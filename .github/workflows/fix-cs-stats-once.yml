name: Fix Czech stats banner once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cs-stats-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Czech stats banner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('cs/index.html')
          text = path.read_text(encoding='utf-8')
          pattern = r'<!-- EVORIOS_CZ_STATS_POLISH_V1 -->.*?</script>\s*(?=</body>)'
          replacement = r'''<!-- EVORIOS_CZ_STATS_POLISH_V2 -->
          <style>
          .ev-cz-stat-grid-fix{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;align-items:stretch!important;gap:0!important}
          .ev-cz-stat-cell-fix{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;min-width:0!important;min-height:210px!important;padding:30px 34px!important;position:relative!important}
          .ev-cz-stat-cell-fix+.ev-cz-stat-cell-fix{border-left:1px solid rgba(13,92,58,.13)!important}
          .ev-cz-stat-title-fix{font-size:clamp(44px,4.4vw,64px)!important;line-height:.98!important;letter-spacing:-.045em!important;font-weight:800!important;color:#0D5C3A!important;margin:0 0 16px!important;padding:0!important;border:0!important;min-height:0!important}
          .ev-cz-stat-title-fix::before,.ev-cz-stat-title-fix::after,.ev-cz-stat-title-wrap-fix::before,.ev-cz-stat-title-wrap-fix::after{display:none!important;content:none!important;border:0!important}
          .ev-cz-stat-title-wrap-fix{border:0!important;padding:0!important;margin:0!important;min-height:0!important}
          .ev-cz-stat-copy-fix{font-size:clamp(17px,1.55vw,22px)!important;line-height:1.25!important;font-weight:500!important;color:#666B68!important;margin:0!important;max-width:250px!important}
          .ev-cz-stat-check-fix{font-size:50px!important;line-height:1!important;color:#0D5C3A!important;margin:0 0 12px!important;width:auto!important;height:auto!important}
          .ev-cz-stat-cell-fix svg.ev-cz-stat-check-fix{width:48px!important;height:48px!important}
          @media(max-width:700px){.ev-cz-stat-grid-fix{grid-template-columns:1fr!important}.ev-cz-stat-cell-fix{min-height:0!important;padding:28px 20px!important}.ev-cz-stat-cell-fix+.ev-cz-stat-cell-fix{border-left:0!important;border-top:1px solid rgba(13,92,58,.13)!important}.ev-cz-stat-title-fix{font-size:44px!important}}
          </style>
          <script>
          (function(){
          function norm(v){return(v||'').replace(/\\s+/g,' ').trim()}
          function leaves(text){var out=[],all=document.querySelectorAll('body *');for(var i=0;i<all.length;i++){var e=all[i];if(norm(e.textContent)!==text)continue;var nested=false;for(var j=0;j<e.children.length;j++){if(norm(e.children[j].textContent)===text){nested=true;break}}if(!nested)out.push(e)}return out}
          function directChildUnder(a,n){while(n&&n.parentElement!==a)n=n.parentElement;return n&&n.parentElement===a?n:null}
          function findGrid(a,b,c){var n=a.parentElement;while(n&&n!==document.body){if(n.contains(b)&&n.contains(c)){var ca=directChildUnder(n,a),cb=directChildUnder(n,b),cc=directChildUnder(n,c);if(ca&&cb&&cc&&ca!==cb&&ca!==cc&&cb!==cc)return{grid:n,cells:[ca,cb,cc]}}n=n.parentElement}return null}
          function findCopy(cell,preferred){var all=cell.querySelectorAll('*'),fallback=null;for(var i=0;i<all.length;i++){var e=all[i],t=norm(e.textContent);if(!t)continue;var nested=false;for(var j=0;j<e.children.length;j++){if(norm(e.children[j].textContent)===t){nested=true;break}}if(nested)continue;if(t===preferred)return e;if(t.length>3&&t!=='Kauce'&&t!=='Ověřeno'&&t!=='3'&&t!=='✓'&&t!=='✔'&&t!=='√')fallback=e}return fallback}
          function locate(){var a=leaves('3'),b=leaves('Kauce'),c=leaves('Ověřeno'),best=null;for(var i=0;i<a.length;i++)for(var j=0;j<b.length;j++)for(var k=0;k<c.length;k++){var f=findGrid(a[i],b[j],c[k]);if(f){var score=f.grid.querySelectorAll('*').length;if(!best||score<best.score)best={f:f,t:[a[i],b[j],c[k]],score:score}}}return best}
          function apply(){var hit=locate();if(!hit)return false;var f=hit.f,t=hit.t,want=['Půjčit · prodat · darovat','Kauce u pronájmu','Ověřené profily'];f.grid.classList.add('ev-cz-stat-grid-fix');for(var i=0;i<3;i++){var cell=f.cells[i];cell.classList.add('ev-cz-stat-cell-fix');t[i].classList.add('ev-cz-stat-title-fix');if(t[i].parentElement)t[i].parentElement.classList.add('ev-cz-stat-title-wrap-fix');var d=findCopy(cell,want[i]);if(d){d.textContent=want[i];d.classList.add('ev-cz-stat-copy-fix')}}var c3=f.cells[2],check=null,cs=c3.querySelectorAll('*');for(var x=0;x<cs.length;x++){var tx=norm(cs[x].textContent);if((tx==='✓'||tx==='✔'||tx==='√')&&cs[x]!==t[2]){check=cs[x];break}}if(!check){var svgs=c3.querySelectorAll('svg');if(svgs.length)check=svgs[0]}if(check)check.classList.add('ev-cz-stat-check-fix');return true}
          function start(){if(apply())return;var ob=new MutationObserver(function(){if(apply())ob.disconnect()});ob.observe(document.body,{childList:true,subtree:true,characterData:true});[250,750,1500,3000,5000].forEach(function(ms){setTimeout(function(){if(apply())ob.disconnect()},ms)})}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start()
          })();
          </script>
          '''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one Czech stats polish block, replaced {count}')
          path.write_text(new_text, encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-cs-stats-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs/index.html .github/workflows/fix-cs-stats-once.yml
          git diff --cached --check
          git commit -m "Fix Czech stats banner reliably"
          git push origin HEAD:main
