name: Audit Czech copy

on:
  push:
    paths:
      - '.github/workflows/audit-czech-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract visible Czech copy
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('style','script'):
                      self.skip += 1
                  a = dict(attrs)
                  if tag == 'meta' and a.get('content') and (a.get('name') in ('description','twitter:title','twitter:description') or a.get('property') in ('og:title','og:description')):
                      self.items.append((f'ATTR {tag}', a['content']))
                  for k in ('alt','aria-label','placeholder','title'):
                      if a.get(k): self.items.append((f'ATTR {tag}.{k}', a[k]))
              def handle_endtag(self, tag):
                  if tag in ('style','script') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if self.skip: return
                  t = re.sub(r'\s+', ' ', data).strip()
                  if t: self.items.append(('TEXT', t))

          src = Path('cs/index.html').read_text(encoding='utf-8')
          p = P(); p.feed(src)
          out=[]
          for i,(kind,text) in enumerate(p.items,1):
              out.append(f'{i:04d}\t{kind}\t{text}')
          Path('cs/copy-audit.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          print(f'Extracted {len(out)} copy strings')
          PY
      - name: Commit audit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-czech-copy.yml
          git add cs/copy-audit.txt
          git commit -m "Extract Czech page copy for review"
          git push origin HEAD:main
